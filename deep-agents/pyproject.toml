[project]
name = "deep-agents"
version = "0.1.0"
description = "Minimal deepagents demo with Alibaba Cloud Qwen (OpenAI-compatible API)"
readme = "README.md"
authors = [
    { name = "syaning", email = "syaningv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.5",
    "langchain-openai>=1.4.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
deep-agents = "deep_agents:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
